services:
  vyline:
    image: ${VYLINE_IMAGE:-ghcr.io/tqmane/vyline:latest}
    pull_policy: always
    ports:
      - "${VYLINE_BIND_ADDRESS:-0.0.0.0}:${VYLINE_PORT:-3000}:3000"
    volumes:
      - ${VYLINE_DATA_PATH:-./data}:/app/data
      - ${VYLINE_STORAGE_PATH:-./storage}:/app/storage
    environment:
      VYLINE_HOST: 0.0.0.0
      VYLINE_LAN_ACCESS: ${VYLINE_LAN_ACCESS:-false}
      PORT: 3000
      VYLINE_DATA_DIR: /app/data
      VYLINE_STORAGE_DIR: /app/storage
      TZ: ${TZ:-Asia/Tokyo}
    init: true
    stop_grace_period: 30s
    restart: unless-stopped
