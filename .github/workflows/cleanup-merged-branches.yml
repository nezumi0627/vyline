name: Cleanup merged branches

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    name: Delete merged PR branches
    runs-on: ubuntu-latest
    steps:
      - name: Delete same-repository merged PR branches
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "closed",
              per_page: 100,
              sort: "updated",
              direction: "desc",
            });

            for (const pr of pulls) {
              if (!pr.merged_at) continue;
              if (pr.head.repo?.full_name !== `${owner}/${repo}`) continue;
              if (!pr.head.ref || pr.head.ref === "main") continue;

              let current;
              try {
                current = await github.rest.git.getRef({
                  owner,
                  repo,
                  ref: `heads/${pr.head.ref}`,
                });
              } catch (error) {
                if (error.status === 404) continue;
                throw error;
              }

              // A closed PR can outlive a reused branch. Delete only when the
              // branch still points at the exact commit that was merged.
              if (current.data.object.sha !== pr.head.sha) continue;

              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${pr.head.ref}`,
                });
                core.info(`Deleted merged branch: ${pr.head.ref}`);
              } catch (error) {
                if (error.status !== 404 && error.status !== 422) throw error;
              }
            }
