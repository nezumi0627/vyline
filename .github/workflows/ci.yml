name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun run docs:readme:check

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install
      - run: bun run typecheck
      - run: bun run test:tooling

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install
      - run: bun run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install
      - run: bun run build
      - run: bun run build:packages

  linux-package:
    name: Linux package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun run package:linux
      - run: bash installer/linux-package-smoke.test.sh

  macos-package:
    name: macOS package (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun run package:mac
      - name: Smoke test the packaged macOS app
        env:
          VYLINE_SMOKE_HOME: ${{ runner.temp }}/vyline-smoke
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          package="dist/macos/Vyline-macos-${{ matrix.arch }}-${version}"
          archive="${package}.zip"
          unpacked="$RUNNER_TEMP/vyline-macos-unpacked"
          mkdir -p "$unpacked"
          ditto -x -k "$archive" "$unpacked"
          app="$unpacked/Vyline-macos-${{ matrix.arch }}-${version}/Vyline.app"
          codesign --verify --strict --deep "$app"
          executable="$app/Contents/MacOS/Vyline"
          test -x "$executable"
          mkdir -p "$VYLINE_SMOKE_HOME"
          resources="$app/Contents/Resources"
          backend="$resources/VylineBackend"
          backend_pid=""
          launcher_pid=""
          cleanup() {
            for pid in "$launcher_pid" "$backend_pid"; do
              if [ -n "$pid" ]; then
                children="$(pgrep -P "$pid" || true)"
                if [ -n "$children" ]; then kill $children 2>/dev/null || true; fi
                kill "$pid" 2>/dev/null || true
                wait "$pid" 2>/dev/null || true
              fi
            done
          }
          trap cleanup EXIT
          backend_url="http://127.0.0.1:18766"
          PORT=18766 VYLINE_HOST=127.0.0.1 \
            VYLINE_CORS_ORIGIN="$backend_url" VYLINE_STATIC_DIR="$resources/web" \
            VYLINE_OPENAPI_PATH="$resources/openapi.yaml" \
            VYLINE_DESKTOP_PROFILE_FALLBACK="$resources/data/desktop-profile.fallback.json" \
            VYLINE_DATA_DIR="$VYLINE_SMOKE_HOME/data" \
            VYLINE_STORAGE_DIR="$VYLINE_SMOKE_HOME/storage" \
            VYLINE_LOG_DIR="$VYLINE_SMOKE_HOME/data/logs" \
            "$backend" &
          backend_pid=$!
          for attempt in {1..30}; do
            if curl --fail --silent "$backend_url/healthz" >/dev/null; then break; fi
            if ! kill -0 "$backend_pid" 2>/dev/null; then
              wait "$backend_pid" || true
              echo "Bundled macOS backend exited before becoming healthy"
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent "$backend_url/healthz" | grep -q '"status":"ready"'
          curl --fail --silent "$backend_url/" | grep -q '/assets/'
          kill "$backend_pid"
          wait "$backend_pid" 2>/dev/null || true
          backend_pid=""

          open -n -a "$app" --env "VYLINE_LAUNCHER_DATA_ROOT=$VYLINE_SMOKE_HOME" \
            --env VYLINE_LAUNCHER_NO_BROWSER=1
          launcher_pid=$(pgrep -x Vyline)
          url="http://127.0.0.1:18765"
          for attempt in {1..30}; do
            if curl --fail --silent "$url/healthz" >/dev/null; then break; fi
            if ! kill -0 "$launcher_pid" 2>/dev/null; then
              echo "Vyline.app launcher exited before the backend became healthy"
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent "$url/healthz" | grep -q '"status":"ready"'
          curl --fail --silent "$url/" | grep -q '/assets/'
          swift -e 'import AppKit; guard let app = NSRunningApplication(processIdentifier: Int32(CommandLine.arguments[1])!), app.isFinishedLaunching, app.activationPolicy == .regular else { fatalError("Native launcher has not completed launch") }' "$launcher_pid"
          backend_pid=$(pgrep -P "$launcher_pid" -x VylineBackend)
          kill -TERM "$launcher_pid"
          for attempt in {1..10}; do
            if ! kill -0 "$launcher_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          ! kill -0 "$launcher_pid" 2>/dev/null
          ! kill -0 "$backend_pid" 2>/dev/null
          wait "$launcher_pid" 2>/dev/null || true
          launcher_pid=""
          backend_pid=""

  docker-build:
    name: Docker build + runtime smoke (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - name: Build native image with shared architecture cache
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          pull: true
          load: true
          tags: vyline
          cache-from: type=gha,scope=container-${{ matrix.arch }}
          cache-to: type=gha,scope=container-${{ matrix.arch }},mode=max
      - name: Verify container startup
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker run -d -p 127.0.0.1:3000:3000 vyline)"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          healthy=false
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/healthz >/dev/null; then
              healthy=true
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' "$container_id")" != "true" ]; then
              echo "Container exited during startup"
              docker logs "$container_id"
              exit 1
            fi
            sleep 1
          done
          if [ "$healthy" != "true" ]; then
            echo "Health check timed out"
            docker logs "$container_id"
            exit 1
          fi

          pid1_uid="$(docker exec "$container_id" sh -c "awk '/^Uid:/ { print \$2 }' /proc/1/status")"
          if [ "$pid1_uid" = "0" ]; then
            echo "Vyline runtime is still running as root"
            docker logs "$container_id"
            exit 1
          fi
