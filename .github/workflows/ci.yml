name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun run docs:readme:check

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install
      - run: bun run typecheck
      - run: bun run test:tooling

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install
      - run: bun run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install
      - run: bun run build
      - run: bun run build:packages

  macos-package:
    name: macOS package (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun run package:mac
      - name: Smoke test the packaged macOS app
        env:
          VYLINE_SMOKE_HOME: ${{ runner.temp }}/vyline-smoke
        run: |
          set -euo pipefail
          version="$(node -p \"require('./package.json').version\")"
          app="dist/macos/Vyline-macos-${{ matrix.arch }}-${version}/Vyline.app"
          executable="$app/Contents/MacOS/Vyline"
          test -x "$executable"
          mkdir -p "$VYLINE_SMOKE_HOME"
          HOME="$VYLINE_SMOKE_HOME" "$executable" &
          launcher_pid=$!
          cleanup() {
            children="$(pgrep -P "$launcher_pid" || true)"
            if [ -n "$children" ]; then kill $children 2>/dev/null || true; fi
            kill "$launcher_pid" 2>/dev/null || true
            wait "$launcher_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          url="http://127.0.0.1:18765"
          for attempt in {1..30}; do
            if curl --fail --silent "$url/healthz" >/dev/null; then
              break
            fi
            if ! kill -0 "$launcher_pid" 2>/dev/null; then
              echo "Vyline.app launcher exited before the backend became healthy"
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent "$url/healthz" | grep -q '"status":"ready"'
          curl --fail --silent "$url/" | grep -q '/assets/'

  docker-build:
    name: Docker build + runtime smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - name: Build image with shared architecture cache
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          pull: true
          load: true
          tags: vyline
          cache-from: type=gha,scope=container-amd64
          cache-to: type=gha,scope=container-amd64,mode=max
      - name: Verify container startup
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker run -d -p 127.0.0.1:3000:3000 vyline)"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          healthy=false
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/healthz >/dev/null; then
              healthy=true
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' "$container_id")" != "true" ]; then
              echo "Container exited during startup"
              docker logs "$container_id"
              exit 1
            fi
            sleep 1
          done
          if [ "$healthy" != "true" ]; then
            echo "Health check timed out"
            docker logs "$container_id"
            exit 1
          fi

          pid1_uid="$(docker exec "$container_id" sh -c "awk '/^Uid:/ { print \$2 }' /proc/1/status")"
          if [ "$pid1_uid" = "0" ]; then
            echo "Vyline runtime is still running as root"
            docker logs "$container_id"
            exit 1
          fi
