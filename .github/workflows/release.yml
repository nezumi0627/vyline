name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/nezumi0627/vyline

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.0" }
      - name: Validate version, tag, notes, and immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          bun run version:check
          test "$BEFORE_SHA" = "0000000000000000000000000000000000000000"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; published releases are immutable." >&2
            exit 1
          fi
      - run: bun install --frozen-lockfile
      - name: Test Linux installer upgrade and rollback in temporary directories
        run: bash installer/install-linux.test.sh
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test

  windows:
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.0" }
      - run: bun install --frozen-lockfile
      - run: choco install innosetup --no-progress --yes
      - run: bun run package:windows
      - name: Verify Windows release files
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          @("dist/windows/VylineSetup-$version.exe") | ForEach-Object {
            if (-not (Test-Path -LiteralPath $_)) { throw "Missing versioned release asset: $_" }
          }
      - name: Create portable Windows archive
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          Compress-Archive -Path "dist/windows/Vyline/*" -DestinationPath "dist/windows/Vyline-portable-$version.zip" -CompressionLevel Optimal
          if (-not (Test-Path -LiteralPath "dist/windows/Vyline-portable-$version.zip")) { throw "Missing versioned portable archive" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/windows/VylineSetup-*.exe
            dist/windows/Vyline-portable-*.zip

  linux:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.0" }
      - run: bun install --frozen-lockfile
      - run: bun run package:linux
      - name: Verify Linux release file
        run: |
          version=$(node -p "require('./package.json').version")
          test -f "dist/linux/Vyline-linux-x64-${version}.tar.gz"
      - name: Smoke test the compiled Linux package
        run: bash installer/linux-package-smoke.test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-archive
          path: dist/linux/Vyline-linux-x64-*.tar.gz

  macos:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            artifact: macos-arm64
            arch: arm64
          - runner: macos-15-intel
            artifact: macos-x64
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.0" }
      - run: bun install --frozen-lockfile
      - run: bun run package:mac
      - name: Verify versioned macOS archive
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          test -f "dist/macos/Vyline-macos-${{ matrix.arch }}-${version}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: dist/macos/Vyline-macos-${{ matrix.arch }}-*.zip

  docker:
    needs: quality
    name: Build ${{ matrix.platform }} image
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VYLINE_VERSION=${{ github.ref_name }}
          cache-from: |
            type=gha,scope=container-${{ matrix.arch }}
            type=gha
          cache-to: type=gha,scope=container-${{ matrix.arch }},mode=max
          provenance: mode=max
          sbom: true
      - name: Export image digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: docker-digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest:
    needs: docker
    name: Publish multi-architecture image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: docker-digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Merge and publish image manifests
        working-directory: ${{ runner.temp }}/digests
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          tags=()
          while IFS= read -r tag; do tags+=(--tag "$tag"); done <<< "$IMAGE_TAGS"
          images=()
          for digest in *; do
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
            images+=("$IMAGE_NAME@sha256:$digest")
          done
          test "${#images[@]}" -eq 2
          docker buildx imagetools create "${tags[@]}" "${images[@]}"
      - name: Verify published architectures
        env:
          IMAGE_TAG: ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
        run: |
          docker buildx imagetools inspect "$IMAGE_TAG" --raw |
            jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]'

  publish:
    needs: [windows, linux, macos, docker-manifest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "{windows-installer,linux-archive,macos-arm64,macos-x64}"
          path: dist
          merge-multiple: true
      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum VylineSetup-*.exe Vyline-portable-*.zip Vyline-linux-x64-*.tar.gz Vyline-macos-*.zip > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          body_path: .github/release-body.md
          generate_release_notes: true
          files: |
            dist/VylineSetup-*.exe
            dist/Vyline-portable-*.zip
            dist/Vyline-linux-x64-*.tar.gz
            dist/Vyline-macos-*.zip
            dist/SHA256SUMS.txt
