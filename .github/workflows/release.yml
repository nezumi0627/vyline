name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/nezumi0627/vyline

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Validate tag and package version
        run: |
          node -e 'const tag = process.env.GITHUB_REF_NAME?.replace(/^v/, ""); if (tag !== require("./package.json").version) process.exit(1)'
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.0" }
      - run: bun install --frozen-lockfile
      - name: Test Linux installer upgrade and rollback in temporary directories
        run: bash installer/install-linux.test.sh
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test

  windows:
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.0" }
      - run: bun install --frozen-lockfile
      - run: choco install innosetup --no-progress --yes
      - run: bun run package:windows
      - name: Create portable Windows archive
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          Compress-Archive -Path "dist/windows/Vyline/*" -DestinationPath "dist/windows/Vyline-portable-$version.zip" -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/windows/VylineSetup-*.exe
            dist/windows/Vyline-portable-*.zip

  linux:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.0" }
      - run: bun install --frozen-lockfile
      - run: bun run package:linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-archive
          path: dist/linux/Vyline-linux-x64-*.tar.gz

  docker:
    needs: quality
    name: Build ${{ matrix.platform }} image
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VYLINE_VERSION=${{ github.ref_name }}
          cache-from: |
            type=gha,scope=container-${{ matrix.arch }}
            type=gha
          cache-to: type=gha,scope=container-${{ matrix.arch }},mode=max
          provenance: mode=max
          sbom: true
      - name: Export image digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: docker-digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest:
    needs: docker
    name: Publish multi-architecture image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: docker-digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest
      - name: Merge and publish image manifests
        working-directory: ${{ runner.temp }}/digests
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          tags=()
          while IFS= read -r tag; do tags+=(--tag "$tag"); done <<< "$IMAGE_TAGS"
          images=()
          for digest in *; do
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
            images+=("$IMAGE_NAME@sha256:$digest")
          done
          test "${#images[@]}" -eq 2
          docker buildx imagetools create "${tags[@]}" "${images[@]}"
      - name: Verify published architectures
        env:
          IMAGE_TAG: ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
        run: |
          docker buildx imagetools inspect "$IMAGE_TAG" --raw |
            jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]'

  publish:
    needs: [windows, linux, docker-manifest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "{windows-installer,linux-archive}"
          path: dist
          merge-multiple: true
      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum VylineSetup-*.exe Vyline-portable-*.zip Vyline-linux-x64-*.tar.gz > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/VylineSetup-*.exe
            dist/Vyline-portable-*.zip
            dist/Vyline-linux-x64-*.tar.gz
            dist/SHA256SUMS.txt
