name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Validate tag and package version
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(node -p \"require('./package.json').version\")"
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.0" }
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test

  windows:
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.0" }
      - run: bun install --frozen-lockfile
      - run: choco install innosetup --no-progress --yes
      - run: bun run package:windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/windows/VylineSetup-*.exe

  linux:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.0" }
      - run: bun install --frozen-lockfile
      - run: bun run package:linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-archive
          path: dist/linux/Vyline-linux-x64-*.tar.gz

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum VylineSetup-*.exe Vyline-linux-x64-*.tar.gz > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/VylineSetup-*.exe
            dist/Vyline-linux-x64-*.tar.gz
            dist/SHA256SUMS.txt
